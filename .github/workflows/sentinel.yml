# 哨兵：問「這個站還活著嗎」，跑在 GitHub 而不是 Mac 上。
#
# 實作在 kb-core 的 reusable workflow，三個資料 repo 共用一份 ——
# 三份各自演化的哨兵，遲早會變成三種不同的判準。
#
# **cron 與 `MAX_DATE_AGE_H` 是一組的，改一個就要回頭改另一個。**
# 年齡是從那一天的**台北零時**起算，上限 36 小時 —— 所以「昨天那一期」是在
# 次日中午 12:00 台北跨線。原本三個哨兵都排在 11:00–11:30，**距離那條線只有
# 30–60 分鐘**，而 GitHub 的排程延遲動輒數十分鐘（2026-08-20 那次延了五小時）。
# 一個判決取決於 cron 準不準時的檢查，會隨機紅、隨機綠。
#
# 改到 07:00 UTC（15:00 台北）之後：昨天的資料 39 小時 → **紅**，今天的 ≤15 小時 → 綠。
# 這同時改變了它問的問題：從「昨天那一期還在不在」（容忍漏掉一天）
# 變成「**今天這一期出來了沒**」。漏一天本來就該當天知道 ——
# 「降級若每天都成功，就不會有人把它升級成問題」的同一條。
name: sentinel

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

jobs:
  sentinel:
    uses: GunDamnBoy/kb-core/.github/workflows/sentinel-reusable.yml@main
    with:
      system_id: chart-of-the-day
    # **caller 一定要給權限。** 被呼叫的 workflow 在自己那份裡宣告的 permissions
    # 是上限的「請求」，實際能拿到多少由 caller 決定 —— 少了這一段，
    # 這支從 2026-08-20 建立起到 08-21 一次都沒成功過（唯一那次 startup_failure），
    # 而**沒有心跳的樣子跟「哨兵判綠」在遠端看起來都是「沒有紅字」**。
    # 另外兩個 repo 的 caller 一直都有這一段，只有這裡漏了。
    permissions:
      contents: write
      issues: write
