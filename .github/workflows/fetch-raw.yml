# 管線 A —— 取數並寫進本 repo 的 raw/。
#
# 三個刻意的設計，改動前先讀：
#
# 1. **只用 workflow_dispatch，暫時不排程。**
#    「規格說有排程、系統卻沒有，比沒有排程更危險」——它會讓人以為每天會自動
#    有資料。等 tracer bullet 全鏈路驗完再加 schedule。
#
# 2. **絕不使用 pull_request_target。**
#    那是 public repo 的 Actions secret 唯一真正的外洩路徑。本 repo 沒有協作者、
#    實務上不會有 fork PR，但「不會有」是運氣不是機制。
#
# 3. **checkout kb-core 不需要任何憑證，因為它是 public。**
#    這一步就是「零 PAT」架構的機制本身：本 repo 推自己用內建 GITHUB_TOKEN，
#    共用程式碼靠 public checkout 取得，全程沒有任何 PAT。
#    kb-core 若改成 private，這裡就必須引入一把 PAT——那不是偏好選擇。

name: fetch-raw

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: checkout 本 repo（資料 repo）
        uses: actions/checkout@v5

      - name: checkout kb-core（public，免認證）
        uses: actions/checkout@v5
        with:
          repository: GunDamnBoy/kb-core
          path: kb-core

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 取數
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python kb-core/tools/fetch_raw.py raw FRED:DGS10

      - name: commit raw
        run: |
          git config user.name  "kb-fetch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw
          # 這裡**不是**「沒變化就跳過」。fetched_at 每次執行都不同，所以
          # 檔案內容必定有變化 —— 原本那個 else 分支永遠不會觸發，是死碼，
          # 而「死碼看起來像已經實作了」比沒實作更隱蔽。
          # 走到這裡若真的無變更，代表 fetch 沒有產出檔案，那是 bug，要大聲失敗。
          if git diff --cached --quiet; then
            echo "::error::raw 無任何變更 —— fetch 未產出檔案"
            exit 1
          fi
          git commit -m "raw: fetch $(date -u +%F)"
          # Mac 端的 publish 也往 main 推 data/，遠端比我新是常態不是意外。
          # 先 rebase 再 push；**絕不 force**，那會抹掉對方剛寫進去的東西。
          git pull --rebase
          git push
