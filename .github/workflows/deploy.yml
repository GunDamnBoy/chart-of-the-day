name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry:
        description: "第幾次自動重開（由 retry job 帶入，人工觸發留 0）"
        required: false
        default: "0"
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write     # retry job 用 GITHUB_TOKEN 另開一次 workflow_dispatch
  issues: write      # 重開兩次仍失敗就開 issue（跟哨兵同一個通報管道）
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # **只把站台要用到的東西挑進去，不是整個 repo。**
      # 舊寫法是 `path: .`，於是 tools/（248K）、raw/（72K）與五份 .md（236K）
      # 每次部署都被一起發到公開網站上 —— 每次約 556K，而且沒有任何人會發現，
      # 因為網站看起來一切正常。
      #
      # 2026-08-20 把程式搬進 kb-core 之後，tools/ 本來就不該在這裡；
      # 但這一段的價值不只是省那 556K，是**讓「發布的內容」變成一個明講的清單**。
      - name: 準備要部署的檔案
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R data _site/
          cp -R charts _site/
          du -sh _site

      # kb-core 的 checkout 2026-08-23 移到上傳之前 —— 下面那道守衛要在上傳前跑。
      # 原本排在後面的理由（白名單是「現在只發這些」不是「以後也只會發這些」）
      # 現在反過來變成前提：**白名單多擔了一個責任，它要擋住 `kb-core/`**。
      - name: 取驗證程式
        uses: actions/checkout@v5
        with:
          repository: GunDamnBoy/kb-core
          path: kb-core

      # **索引與日檔說的是不是同一件事。**
      # 清單頁讀 `data/index.json` 的複本、單篇頁讀 `data/<日期>.json`，
      # 兩邊漂開時**兩頁各自都正常、但說的不是同一件事**，沒有人會發現。
      # 2026-08-23 外資報告週摘就是這樣：首頁一整面舊標題、單篇頁全對，
      # 而 verify_live 是綠的而且它是對的（線上就是剛上傳的那份）。
      # `weekday` 兩邊刻意不同：索引是 `六`（下拉選單用），日檔是 `週六`（頁首日期列用）。
      # 放行要明講，而守衛會回報這條擋掉幾次 —— **0 次代表它已經沒用了，該刪**。
      - name: 驗證索引與日檔一致
        run: python3 kb-core/tools/verify_site_index.py _site --allow-differ weekday

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

      # **部署完不等於讀者看得到。** 比雜湊不比欄位的理由寫在 verify_live.py 的 docstring。
      - name: 驗證線上那份就是剛上傳的那份
        run: |
          python3 kb-core/tools/verify_live.py \
            "${{ steps.deployment.outputs.page_url }}" data/index.json

  # **部署失敗時另開一次全新的執行，不是重跑同一次。**（2026-11-25 加）
  #
  # 2026-11-24 與 11-25 連兩天 `deploy-pages` 回「No artifacts named "github-pages" were
  # found」（上傳那一步是成功的）。11-24 同一次執行重跑到第 4 次才過、網站晚三小時；
  # 11-25 同一次執行重跑兩次都失敗，**手動另開一次 workflow_dispatch 三十秒就上線**。
  # 所以這裡用 GITHUB_TOKEN 另開新的一次（GITHUB_TOKEN 觸發的事件不會開新執行，
  # 唯一的例外就是 workflow_dispatch），最多兩次；仍失敗就開 issue。
  #
  # **它藏住的方式**：push 成功，publish 的回執是 exit 0，本機與 origin 同一顆 commit，
  # 而哨兵排在 15:20 卻實際晚 7–12 小時才跑。兩天都是使用者自己看到網站沒更新才發現的。
  # 內容守衛（verify_site_index）擋下時也會走到這裡 —— 那種重開兩次一樣會紅，
  # 最後開出來的 issue 是對的出口，只是多花兩次執行。
  retry:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 另開一次全新的部署（最多兩次），仍失敗就開 issue
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          if [ "$RETRY" -lt 2 ]; then
            sleep 60
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f retry=$((RETRY + 1))
            echo "已另開第 $((RETRY + 1)) 次自動重開"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Pages 部署連續失敗（$(date -u +%F)）" \
              --body "deploy.yml 失敗，自動另開兩次仍失敗。最後一次：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID 。push 與 publish 回執都是成功的，網站停在上一期。"
          fi
